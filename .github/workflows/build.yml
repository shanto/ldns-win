name: Build ldns for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ldns version to build (defaults to the newest upstream tag)"
        required: false
        type: string
  schedule:
    # Daily, well before the bucket's 04:23 autoupdate, so a new upstream tag
    # usually has its release published by the time the bucket looks.
    - cron: "0 3 * * *"
  push:
    branches:
      - master
    paths:
      - "patches/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-ldns
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.upstream.outputs.commit }}
      published: ${{ steps.published.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$REQUESTED"
          if [ -z "$version" ]; then
            # NLnetLabs publishes tags, not GitHub releases, so there is no
            # /releases/latest to read: take the newest stable X.Y.Z tag and
            # let the already-published guard below dedupe.
            version="$(gh api 'repos/NLnetLabs/ldns/tags?per_page=100' --paginate \
              --jq '.[].name' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n 1)"
            echo "newest upstream tag: $version"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not an ldns version string (expected e.g. 1.9.2)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ldns-$version" >> "$GITHUB_OUTPUT"

      - name: Prove the upstream tag exists
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Fail here rather than half way through a matrix build against a tag
          # that NLnetLabs never published.
          ref="$(gh api "repos/NLnetLabs/ldns/git/ref/tags/$VERSION")"
          sha="$(printf '%s' "$ref" | jq -r '.object.sha')"
          if [ "$(printf '%s' "$ref" | jq -r '.object.type')" = "tag" ]; then
            sha="$(gh api "repos/NLnetLabs/ldns/git/tags/$sha" --jq '.object.sha')"
          fi
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "NLnetLabs/ldns $VERSION -> $sha"

      - name: Skip when this version is already released
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # A published release is immutable here: the bucket's autoupdate URL is
          # keyed on the upstream version, so a rebuild would have to overwrite
          # assets. Fixing a patch therefore means a new upstream version (or
          # deleting the release by hand first).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already published; nothing to build."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: resolve
    if: needs.resolve.outputs.published != 'true'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: UCRT64
            prefix: /ucrt64
            toolchain: mingw-w64-ucrt-x86_64-toolchain
            autotools: mingw-w64-ucrt-x86_64-autotools
            openssl: mingw-w64-ucrt-x86_64-openssl
            cc: gcc
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            prefix: /clangarm64
            toolchain: mingw-w64-clang-aarch64-toolchain
            autotools: mingw-w64-clang-aarch64-autotools
            openssl: mingw-w64-clang-aarch64-openssl
            cc: clang

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          cache: true
          update: true
          install: >-
            ${{ matrix.toolchain }}
            ${{ matrix.autotools }}
            ${{ matrix.openssl }}
            zip

      - name: Checkout build recipe
        uses: actions/checkout@v5

      - name: Checkout ldns
        uses: actions/checkout@v5
        with:
          path: ldns
          repository: NLnetLabs/ldns
          ref: ${{ needs.resolve.outputs.version }}
          fetch-depth: 0

      - name: Apply patches
        working-directory: ldns
        shell: bash
        run: |
          set -e
          # The patches are LF. A Windows runner that checked ldns out as CRLF
          # makes every hunk miss, so normalize the two patched files first.
          if grep -q $'\r' configure.ac drill/drill.c; then
            echo "ldns checkout is CRLF; normalizing configure.ac and drill/drill.c to LF"
            sed -i 's/\r$//' configure.ac drill/drill.c
          fi
          for patch in ../patches/ldns-windows-winsock.patch \
                       ../patches/ldns-windows-resolver.patch; do
            echo "Applying $patch"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Build ldns
        working-directory: ldns
        run: |
          libtoolize -ci
          autoreconf -fi
          CC=${{ matrix.cc }} ./configure \
            --prefix=${{ matrix.prefix }} \
            --disable-rpath \
            --with-ssl=${{ matrix.prefix }} \
            --with-drill \
            --with-examples \
            --with-trust-anchor=root.key
          # Required: the Makefile's setup-builddir rule runs `ln -s .libs lib`,
          # and MSYS2's ln emulation copies the target instead of symlinking it,
          # so `.libs` must already exist or make dies with "ln: failed to create
          # symbolic link 'lib': No such file or directory".
          mkdir -p .libs
          make -j"$(nproc)"
          STAGING="$(cygpath "$GITHUB_WORKSPACE")/staging"
          rm -rf "$STAGING"
          make DESTDIR=$STAGING install

      - name: Package
        working-directory: ldns
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          UPSTREAM_COMMIT: ${{ needs.resolve.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          ZIP="ldns-windows-$ARCH.zip"
          PACK="$(cygpath "$GITHUB_WORKSPACE")/pack"
          STAGING="$(cygpath "$GITHUB_WORKSPACE")/staging${{ matrix.prefix }}"
          rm -rf "$PACK"
          mkdir -p "$PACK"
          cp "$STAGING"/bin/*.exe "$PACK"/
          cp "$STAGING"/bin/*.dll "$PACK"/
          cp ${{ matrix.prefix }}/bin/libssl*.dll "$PACK"
          cp ${{ matrix.prefix }}/bin/libcrypto*.dll "$PACK"
          "$PACK"/drill.exe . DNSKEY > root.sig
          "$PACK"/ldns-key2ds.exe -n root.sig > "$PACK"/root.key
          cp LICENSE README Changelog "$PACK"/
          {
            echo "Unofficial Windows build of ldns $VERSION ($ARCH)."
            echo
            echo "Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "from NLnetLabs/ldns $VERSION ($UPSTREAM_COMMIT)."
            echo "Upstream does not publish or support Windows binaries; report problems"
            echo "with this build here, not upstream."
            echo
            echo "Patches applied:"
            for patch in ../patches/*.patch; do
              echo "  $(basename "$patch")"
            done
          } > "$PACK"/BUILD-NOTICE.txt
          pushd "$PACK"
          zip -r "../$ZIP" .
          sha256sum "../$ZIP" > "../$ZIP.sha256"
          popd

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v2
        if: ${{ failure() }}
        with:
          wait-timeout-minutes: 5

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ldns-windows-${{ matrix.arch }}
          path: |
            ldns-windows-${{ matrix.arch }}.zip
            ldns-windows-${{ matrix.arch }}.zip.sha256

  release:
    name: Publish release
    needs:
      - resolve
      - build
    if: needs.resolve.outputs.published != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ldns-windows-*
          path: release
          merge-multiple: true

      - name: Verify artifacts against their checksums
        working-directory: release
        run: |
          set -euo pipefail
          for arch in x64 arm64; do
            zip="ldns-windows-$arch.zip"
            [ -f "$zip" ] && [ -f "$zip.sha256" ] || { echo "::error::missing $zip"; exit 1; }
            expected="$(awk '{print $1}' "$zip.sha256")"
            actual="$(sha256sum "$zip" | awk '{print $1}')"
            if [ "$expected" != "$actual" ]; then
              echo "::error::$zip: checksum file says $expected, bytes are $actual"
              exit 1
            fi
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ldns ${{ needs.resolve.outputs.version }} for Windows
          body: |
            Unofficial Windows builds of ldns ${{ needs.resolve.outputs.version }}
            (x64 + arm64), cross-compiled from NLnetLabs/ldns ${{ needs.resolve.outputs.version }}
            with the patches in `patches/`. Upstream publishes no Windows binaries and
            does not support these.
          files: |
            release/ldns-windows-x64.zip
            release/ldns-windows-x64.zip.sha256
            release/ldns-windows-arm64.zip
            release/ldns-windows-arm64.zip.sha256

      - name: Read the release back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        working-directory: release
        run: |
          set -euo pipefail
          # A 2xx on upload is not evidence the right bytes landed.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort > published.txt
          cat published.txt
          for arch in x64 arm64; do
            zip="ldns-windows-$arch.zip"
            grep -qx "$zip $(stat -c%s "$zip")" published.txt \
              || { echo "::error::$zip is missing or the wrong size on the release"; exit 1; }
          done

      - name: Update the bucket manifest
        env:
          GH_TOKEN: ${{ secrets.PAT_SCOOP_RW }}
          BUCKET_REPO: ${{ vars.BUCKET_REPO || 'shanto/Scoop' }}
          VERSION: ${{ needs.resolve.outputs.version }}
        working-directory: release
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PAT_SCOOP_RW is not set; skipping the bucket manifest update."
            exit 0
          fi
          api="repos/$BUCKET_REPO/contents/bucket/ldns.json"
          gh api "$api" --jq '.content' | base64 -d > manifest.json
          sha="$(gh api "$api" --jq '.sha')"

          # Only bump a manifest that already points at this repo's releases;
          # writing hashes for assets the manifest does not download would
          # publish a package that fails its integrity check.
          expected="https://github.com/$GITHUB_REPOSITORY/releases/download/"
          current="$(jq -r '.architecture["64bit"].url' manifest.json)"
          case "$current" in
            "$expected"*) ;;
            *)
              echo "::notice::$BUCKET_REPO bucket/ldns.json points at $current, not $expected; leaving it alone."
              exit 0
              ;;
          esac

          x64="$(awk '{print $1}' ldns-windows-x64.zip.sha256)"
          arm64="$(awk '{print $1}' ldns-windows-arm64.zip.sha256)"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/ldns-$VERSION/"
          autoupdate_base="https://github.com/$GITHUB_REPOSITORY/releases/download/ldns-\$version/"
          jq --indent 4 --arg version "$VERSION" --arg base "$base" --arg auto "$autoupdate_base" \
            --arg x64 "$x64" --arg arm64 "$arm64" \
            '.version = $version
            | .architecture["64bit"].url = ($base + "ldns-windows-x64.zip")
            | .architecture["64bit"].hash = $x64
            | .architecture.arm64.url = ($base + "ldns-windows-arm64.zip")
            | .architecture.arm64.hash = $arm64
            | .autoupdate.architecture["64bit"].url = ($auto + "ldns-windows-x64.zip")
            | .autoupdate.architecture.arm64.url = ($auto + "ldns-windows-arm64.zip")' \
            manifest.json > updated.json
          gh api -X PUT "$api" \
            -f message="ldns $VERSION" \
            -f content="$(base64 -w0 updated.json)" \
            -f sha="$sha" \
            -f branch=master > /dev/null
          echo "Updated $BUCKET_REPO bucket/ldns.json to $VERSION"
